<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop - Clothing Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<script>
  // Redirect if not logged in
  if (localStorage.getItem("loggedIn") !== "true") {
    alert("You must log in or create an account to access the Shop.");
    window.location.href = "login.html";
  }
</script>

<header class="navbar">
  <nav class="nav-left">
    <a href="index.html" class="nav-button">Home</a>
    <a href="shop.html" class="nav-button">Shop</a>
    <a href="collection.html" class="nav-button">Collection</a>
    <a href="cart.html" class="nav-button">Cart</a>
    <a href="login.html" class="nav-button" id="loginBtn">Log In</a>
  </nav>
</header>

<main style="padding:2rem;">
  <h1>Welcome to the Shop</h1>
  <div id="products-container">
    <p>Loading products...</p>
  </div>
</main>

<script>
  // Dynamic login/logout button
  const loginBtn = document.getElementById("loginBtn");
  if (localStorage.getItem("loggedIn") === "true") {
    loginBtn.textContent = "Logout";
    loginBtn.onclick = () => {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("cart");
      alert("You have logged out.");
      window.location.href = "index.html";
    }
  } else {
    loginBtn.onclick = () => window.location.href = "login.html";
  }

  // Display products dynamically
  const products = [
    "Light Pink Women Pants",
    "Light Gray Fleece",
    "Yellow Sleeveless Dress",
    "Dark Brown Dress"
  ];

  const container = document.getElementById("products-container");
  container.innerHTML = ""; // clear placeholder
  products.forEach(item => {
    const div = document.createElement("div");
    div.style.marginBottom = "10px";
    div.innerHTML = `<strong>${item}</strong>`;
    container.appendChild(div);
  });
</script>

</body>
</html>
