<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - Clothing Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<script>
  if (localStorage.getItem("loggedIn") !== "true") {
    alert("You must log in or create an account to access the Cart.");
    window.location.href = "login.html";
  }
</script>

<header class="navbar">
  <nav class="nav-left">
    <a href="index.html" class="nav-button">Home</a>
    <a href="shop.html" class="nav-button">Shop</a>
    <a href="collection.html" class="nav-button">Collection</a>
    <a href="cart.html" class="nav-button">Cart</a>
    <a href="login.html" class="nav-button" id="loginBtn">Log In</a>
  </nav>
</header>

<main style="padding:2rem;">
  <h1>Your Cart</h1>
  <div id="cart-container">
    <p>Loading your cart...</p>
  </div>
</main>

<script>
  // Dynamic login/logout button
  const loginBtn = document.getElementById("loginBtn");
  if (localStorage.getItem("loggedIn") === "true") {
    loginBtn.textContent = "Logout";
    loginBtn.onclick = () => {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("cart");
      alert("You have logged out.");
      window.location.href = "index.html";
    }
  } else {
    loginBtn.onclick = () => window.location.href = "login.html";
  }

  // Display cart items dynamically
  let cart = JSON.parse(localStorage.getItem("cart")) || [];
  const container = document.getElementById("cart-container");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = "<p>Your cart is empty.</p>";
  } else {
    cart.forEach(item => {
      const div = document.createElement("div");
      div.style.marginBottom = "10px";
      div.textContent = item;
      container.appendChild(div);
    });
  }
</script>

</body>
</html>
