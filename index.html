<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store - Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <!-- LEFT NAV LINKS -->
  <nav class="nav-left" aria-label="Main navigation">
    <a href="#" class="nav-button">Home</a>
    <a href="#" class="nav-button">Shop</a>
    <a href="#" class="nav-button">About Us</a>
    <a href="#" class="nav-button">Collection</a>
    <a href="#" class="nav-button">Log In</a>
  </nav>

  <!-- CENTER LOGO -->
  <div class="nav-center">
    <img src="logo.png" alt="Clothing Store Logo" class="logo">
  </div>

  <!-- RIGHT SEARCH BAR -->
  <div class="nav-right">
    <label for="search" class="visually-hidden">Search products</label>
    <input type="search" id="search" aria-label="Search products" placeholder="Search">
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
  <h1 class="visually-hidden">Clothing Store Home Page</h1>

  <section class="products-section" aria-labelledby="new-collection-heading">

    <!-- PRODUCT GRID -->
    <div class="products">
      <div class="product">
        <img src="product1.jpg" alt="Light Pink Women Pants with two pockets">
        <p><strong>Light Pink Women Pants with two pockets</strong></p>
      </div>
      <div class="product">
        <img src="product2.jpg" alt=" Gray Fleece for women">
        <p><strong>Light Gray Fleece</strong></p>
      </div>
      <div class="product">
        <img src="product3.jpg" alt="Yellow Sleeveless Dress fro Women">
        <p><strong>Yellow Sleeveless Dress fro Women </strong></p>
      </div>
      <div class="product">
        <img src="product4.jpg" alt="Dark brown dress for women">
        <p><strong>Dark brown dress for women</strong></p>
      </div>
    </div>

    <!-- NEW COLLECTION TEXT ON SIDE -->
    <aside class="new-collection">
      <h2 id="new-collection-heading">NEW COLLECTION</h2>
      <p>Made to Wear</p>
    </aside>

  </section>
</main>

<!-- FOOTER -->
<footer>
  <p>&copy; Rmohle MadeToStandOut</p>
</footer>

</body>
</html>
