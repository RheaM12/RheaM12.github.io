<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store - Home</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <!-- LEFT NAV LINKS -->
  <nav class="nav-left" aria-label="Main navigation">
    <a href="index.html" class="nav-button">Home</a>
    <a href="shop.html" class="nav-button">Shop</a>
    <a href="about.html" class="nav-button">About Us</a>
    <a href="collection.html" class="nav-button">Collection</a>
    <a href="cart.html" class="nav-button">Cart</a>
    <a href="login.html" class="nav-button">Log In</a>
  </nav>

  <!-- CENTER LOGO -->
  <div class="nav-center">
    <img src="logo.png" alt="Clothing Store Logo" class="logo">
  </div>

  <!-- RIGHT SEARCH BAR -->
  <div class="nav-right">
    <label for="search" class="visually-hidden">Search products</label>
    <input type="search" id="search" aria-label="Search products" placeholder="Search">
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
  <h1 class="visually-hidden">Clothing Store Home Page</h1>

  <section class="products-section" aria-labelledby="new-collection-heading">

    <!-- PRODUCT GRID -->
    <div class="product">
  <img src="product1.jpg" alt="Light Pink Women Pants with two pockets">
  <p><strong>Light Pink Women Pants with two pockets</strong></p>
  <button onclick="addToCart('Light Pink Women Pants')">Add to Cart</button>
</div>

<div class="product">
  <img src="product2.jpg" alt="Light Gray Fleece for women">
  <p><strong>Light Gray Fleece</strong></p>
  <button onclick="addToCart('Light Gray Fleece')">Add to Cart</button>
</div>

<div class="product">
  <img src="product3.jpg" alt="Yellow Sleeveless Dress for women">
  <p><strong>Yellow Sleeveless Dress for Women</strong></p>
  <button onclick="addToCart('Yellow Sleeveless Dress')">Add to Cart</button>
</div>

<div class="product">
  <img src="product4.jpg" alt="Dark brown dress for women">
  <p><strong>Dark Brown Dress for Women</strong></p>
  <button onclick="addToCart('Dark Brown Dress')">Add to Cart</button>
</div>


    <!-- NEW COLLECTION TEXT ON SIDE -->
    <aside class="new-collection">
      <h2 id="new-collection-heading">NEW COLLECTION</h2>
      <p>Made to Wear</p>
    </aside>

  </section>
</main>

<!-- FOOTER -->
<footer>
  <p>&copy; Rmohle MadeToStandOut</p>
</footer>
  <script>
let cart = [];

function addToCart(productName) {
  cart.push(productName);
  alert(productName + " added to cart!");
  console.log(cart);
}
<script>
// DYNAMIC LOGIN / LOGOUT BUTTON
const navButtons = document.querySelectorAll('.nav-left .nav-button');
const loginBtn = Array.from(navButtons).find(btn => btn.textContent === "Log In");
const homeBtn = Array.from(navButtons).find(btn => btn.textContent === "Home");

// Make Home button always go to main dashboard
homeBtn.onclick = function() {
  window.location.href = "index.html"; // redirects to dashboard
}


if (localStorage.getItem("loggedIn") === "true") {
  loginBtn.textContent = "Logout";
  loginBtn.onclick = function() {
    localStorage.removeItem("loggedIn");
    localStorage.removeItem("userEmail");
    localStorage.removeItem("userName");
    alert("You have logged out.");
    window.location.href = "index.html"; // stay on home after logout
  }
} else {
  loginBtn.onclick = function() {
    window.location.href = "login.html"; // go to login page if not logged in
  }
}
</script>

</body>
</html>
