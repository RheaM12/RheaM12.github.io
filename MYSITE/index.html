<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clothing Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- NAVBAR -->
<header class="navbar">
  <!-- LEFT NAV LINKS -->
  <nav class="nav-left">
    <a href="#" class="nav-button">Home</a>
    <a href="#" class="nav-button">Shop</a>
    <a href="#" class="nav-button">About Us</a>
    <a href="#" class="nav-button">Collection</a>
    <a href="#" class="nav-button">Log In</a>
  </nav>

  <!-- CENTER LOGO -->
  <div class="nav-center">
    <img src="logo.png" alt="Store Logo" class="logo">
  </div>

  <!-- RIGHT SEARCH BAR -->
  <div class="nav-right">
    <input type="search" aria-label="Search products" placeholder="Search">
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="main-content">
  <section class="products-section">

   <div class="products">
  <div class="product"><img src="product1.jpg" alt="Product 1"></div>
  <div class="product"><img src="product2.jpg" alt="Product 2"></div>
  <div class="product"><img src="product3.jpg" alt="Product 3"></div>
  <div class="product"><img src="product4.jpg" alt="Product 4"></div>
</div>


    <!-- NEW COLLECTION TEXT -->
    <aside class="new-collection">
      <h2>NEW COLLECTION</h2>
      <p>Made to Wear</p>
    </aside>

  </section>
</main>

<!-- FOOTER -->
<footer>
  <p>&copy; 2026 Clothing Store</p>
</footer>

</body>
</html>
