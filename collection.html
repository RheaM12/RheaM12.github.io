<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Collection - Clothing Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<script>
  if (localStorage.getItem("loggedIn") !== "true") {
    alert("You must log in or create an account to access the Collection.");
    window.location.href = "login.html";
  }
</script>

<header class="navbar">
  <nav class="nav-left">
    <a href="index.html" class="nav-button">Home</a>
    <a href="shop.html" class="nav-button">Shop</a>
    <a href="collection.html" class="nav-button">Collection</a>
    <a href="cart.html" class="nav-button">Cart</a>
    <a href="login.html" class="nav-button" id="loginBtn">Log In</a>
  </nav>
</header>

<main style="padding:2rem;">
  <h1>Collection</h1>
  <div id="collection-container" class="products-section">
    <!-- Collection products appear here -->
  </div>
</main>

<script>
  // Dynamic login/logout button
  const loginBtn = document.getElementById("loginBtn");
  if (localStorage.getItem("loggedIn") === "true") {
    loginBtn.textContent = "Logout";
    loginBtn.onclick = () => {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("cart");
      alert("You have logged out.");
      window.location.href = "index.html";
    }
  } else {
    loginBtn.onclick = () => window.location.href = "login.html";
  }

  // Collections array
  const collections = [
    { name: "Summer Essentials", img: "product1.jpg", link: "https://example.com/summer" },
    { name: "Winter Collection", img: "product2.jpg", link: "https://example.com/winter" },
    { name: "Formal Attire", img: "product3.jpg", link: "https://example.com/formal" },
    { name: "Casual Wear", img: "product4.jpg", link: "https://example.com/casual" }
  ];

  const container = document.getElementById("collection-container");
  container.innerHTML = "";

  collections.forEach(item => {
    const div = document.createElement("div");
    div.className = "product";
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <p><strong>${item.name}</strong></p>
      <button onclick="addToCart('${item.name}')">Add to Cart</button>
      <p><a href="${item.link}" target="_blank">More Info</a></p>
    `;
    container.appendChild(div);
  });

  function addToCart(name) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.push(name);
    localStorage.setItem("cart", JSON.stringify(cart));
    alert(name + " added to cart!");
  }
</script>

</body>
</html>
