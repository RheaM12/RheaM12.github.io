<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Clothing Store</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <nav class="nav-left">
      <ul>
        <li><a href="index.html" class="nav-button">Home</a></li>
        <li><a href="shop.html" class="nav-button">Shop</a></li>
        <li><a href="collection.html" class="nav-button">Collection</a></li>
        <li><a href="cart.html" class="nav-button">Cart</a></li>
        <li><a href="login.html" class="nav-button">Log In</a></li>
        <li><a href="about.html" class="nav-button">About Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- LOGIN FORM -->
  <div class="login-container">
    <h2>Login to Your Account</h2>
    <form onsubmit="return validateLogin()">
      <label>Email:</label>
      <input type="email" id="email" required>

      <label>Password:</label>
      <input type="password" id="password" required>

      <button type="submit">Log In</button>
    </form>
  </div>

  <script>
    // LOGIN FUNCTION
    function validateLogin() {
      let email = document.getElementById("email").value;
      let password = document.getElementById("password").value;

      // simple test user
      if (email === "test@email.com" && password === "1234") {
        alert("Login successful!");
        localStorage.setItem("loggedIn", "true");
        window.location.href = "shop.html"; // redirect after login
      } else {
        alert("Invalid email or password");
      }
      return false; // prevent page reload
    }
  </script>

</body>
</html>
